<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Peta Desa Setia Mulya</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: Georgia, 'Times New Roman', serif;
      background: #f3efe6;
      color: #2a2a2a;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 10px 18px;
      border-bottom: 1px solid #cfc8b8;
      background: #f3efe6;
    }
    header h1 { font-size: 1.15rem; font-weight: bold; }
    header p { font-size: 0.78rem; color: #6b6558; margin-top: 1px; font-family: Arial, sans-serif; }

    .wrap { flex: 1; display: flex; min-height: 0; }
    #map { flex: 1; }

    aside {
      width: 300px;
      border-left: 1px solid #cfc8b8;
      display: flex;
      flex-direction: column;
      font-family: Arial, sans-serif;
      background: #f3efe6;
    }
    .tools { padding: 10px 12px; border-bottom: 1px solid #cfc8b8; }
    .tools input, .tools select {
      width: 100%;
      padding: 6px 8px;
      border: 1px solid #b9b19e;
      background: #fffdf8;
      font-size: 0.82rem;
      font-family: inherit;
      color: #2a2a2a;
    }
    .tools select { margin-top: 6px; }

    #list { flex: 1; overflow-y: auto; padding: 4px 0 10px; }
    .grup {
      font-size: 0.7rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #6b6558;
      padding: 12px 12px 4px;
    }
    .grup i {
      display: inline-block;
      width: 9px; height: 9px;
      border-radius: 50%;
      margin-right: 6px;
    }
    .baris {
      padding: 6px 12px;
      font-size: 0.85rem;
      cursor: pointer;
      line-height: 1.3;
    }
    .baris:hover { background: #e8e2d3; }
    .baris span { display: block; font-size: 0.72rem; color: #7a7466; }

    .catatan {
      padding: 8px 12px;
      border-top: 1px solid #cfc8b8;
      font-size: 0.68rem;
      color: #7a7466;
      line-height: 1.4;
    }

    .leaflet-popup-content { font-family: Arial, sans-serif; font-size: 0.82rem; margin: 10px 12px; }
    .leaflet-popup-content h3 { font-family: Georgia, serif; font-size: 0.95rem; margin-bottom: 3px; }
    .leaflet-popup-content img { display: block; width: 100%; height: 130px; object-fit: cover; margin-bottom: 6px; }
    .leaflet-popup-content p { margin: 2px 0; color: #444; }
    .leaflet-popup-content a { color: #8a3b12; }

    @media (max-width: 768px) {
      .wrap { flex-direction: column; }
      #map { flex: none; height: 55%; }
      aside { width: 100%; flex: 1; border-left: none; border-top: 1px solid #cfc8b8; min-height: 0; }
    }
  </style>
</head>
<body>

  <header>
    <h1>Peta Desa Setia Mulya</h1>
    <p>Kecamatan Tarumajaya, Kabupaten Bekasi &middot; KKN Universitas Bhayangkara Jakarta Raya</p>
  </header>

  <div class="wrap">
    <div id="map"></div>
    <aside>
      <div class="tools">
        <input type="text" id="cari" placeholder="Cari tempat..." />
        <select id="jenis"></select>
      </div>
      <div id="list"></div>
      <div class="catatan">
        KKN Kelompok 13<br>Universitas Bhayangkara Jaya
      </div>
    </aside>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const map = L.map('map').setView([-6.137, 106.991], 15);

    const jalan = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      attribution: '&copy; OpenStreetMap'
    }).addTo(map);
    const satelit = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Esri'
    });
    L.control.layers({ "Peta": jalan, "Satelit": satelit }, null, { position: 'topleft' }).addTo(map);

    // Batas desa. Kalau sudah punya koordinat sendiri (dari geojson.io atau kantor desa),
    // tempel GeoJSON-nya di BATAS_MANUAL. Kalau dibiarkan null, dicari otomatis dari OpenStreetMap.
    const BATAS_MANUAL = null;

    const gayaBatas = { color: '#8a3b12', weight: 2, dashArray: '6 5', fillColor: '#8a3b12', fillOpacity: 0.05 };

    async function cariBatas() {
      if (BATAS_MANUAL) {
        L.geoJSON(BATAS_MANUAL, { style: gayaBatas }).addTo(map);
        return;
      }

      // 1) Nominatim
      const kueri = ['Setiamulya, Tarumajaya, Bekasi', 'Desa Setia Mulya, Tarumajaya', 'Setia Mulya, Kabupaten Bekasi'];
      for (const q of kueri) {
        try {
          const r = await fetch('https://nominatim.openstreetmap.org/search?format=jsonv2&polygon_geojson=1&limit=10&q=' + encodeURIComponent(q));
          const hasil = await r.json();
          const desa = hasil.find(h => h.category === 'boundary' && h.geojson && /Polygon/.test(h.geojson.type));
          if (desa) { L.geoJSON(desa.geojson, { style: gayaBatas }).addTo(map); return; }
        } catch (e) { /* lanjut ke cara berikutnya */ }
      }

      // 2) Overpass: gambar garis batas dari relasi administrasi bernama Setia Mulya
      try {
        const data = '[out:json][timeout:25];rel["boundary"="administrative"]["name"~"Setia ?mulya",i](-6.25,106.9,-6.05,107.1);out geom;';
        const r = await fetch('https://overpass-api.de/api/interpreter?data=' + encodeURIComponent(data));
        const j = await r.json();
        let ada = false;
        (j.elements || []).forEach(rel => {
          (rel.members || []).forEach(m => {
            if (m.geometry && m.geometry.length > 1) {
              L.polyline(m.geometry.map(p => [p.lat, p.lon]), gayaBatas).addTo(map);
              ada = true;
            }
          });
        });
        if (!ada) console.warn('Batas Setia Mulya tidak ditemukan di OpenStreetMap');
      } catch (e) {
        console.warn('Gagal memuat batas desa', e);
      }
    }
    cariBatas();

    const WARNA = {
      "Pemerintahan": "#9c2f2f",
      "Kesehatan": "#c26a1b",
      "Pendidikan": "#2f5d8a",
      "Tempat Ibadah": "#3f7a57",
      "Toko & Layanan": "#6b4f8a",
      "Pemakaman": "#777777"
    };

    // Tambah tempat baru: salin satu blok, isi, taruh sebelum penutup ]
    // foto: taruh gambar di folder "foto" sebelah file ini dengan nama sesuai isian di bawah
    const tempat = [
      { nama: "Kantor Kepala Desa Setia Mulya", jenis: "Pemerintahan",
        lat: -6.1477082, lng: 106.9908815, foto: "foto/kantor-desa.jpg",
        alamat: "Jl. Taruma Jaya", telp: "(021) 6073 9845", jam: "" },

      { nama: "UPTD Puskesmas Setiamulya", jenis: "Kesehatan",
        lat: -6.1478786, lng: 106.991002, foto: "foto/puskesmas.jpg",
        alamat: "Jl. Taruma Jaya No. 168", telp: "",
        jam: "Senin-Kamis 07.45-15.00, Jumat 07.45-14.30, Sabtu 07.45-14.00" },

      { nama: "SDN Setia Mulya 01", jenis: "Pendidikan",
        lat: -6.1471226, lng: 106.9908861, foto: "foto/sdn-01.jpg",
        alamat: "Kp. Bogor, Jl. Taruma Jaya", telp: "(021) 8899 7183", jam: "" },
      { nama: "SDN Setia Mulya 02", jenis: "Pendidikan",
        lat: -6.1405965, lng: 106.9900825, foto: "foto/sdn-02.jpg",
        alamat: "Kp. Pamahan, Jl. Taruma Jaya No. 10", telp: "", jam: "" },
      { nama: "MTs Attaqwa 13 Pamahan", jenis: "Pendidikan",
        lat: -6.1390079, lng: 106.9911111, foto: "foto/mts-attaqwa-13.jpg",
        alamat: "Jl. Taruma Jaya No. 14, Kp. Pamahan", telp: "0881-4068-053", jam: "" },
      { nama: "SMP Attaqwa 05 Lagoa", jenis: "Pendidikan",
        lat: -6.129847, lng: 106.994596, foto: "foto/smp-attaqwa-05.jpg",
        alamat: "Jl. Masjid Nurul Mubin, Kp. Lagoa", telp: "(021) 8899 0631", jam: "" },
      { nama: "SDIT Insan Mulya (TK, TPQ, Majelis Taklim)", jenis: "Pendidikan",
        lat: -6.1334518, lng: 106.9918182, foto: "foto/sdit-insan-mulya.jpg",
        alamat: "Jl. Taruma Jaya No. 15", telp: "0821-1154-1538", jam: "" },
      { nama: "TK Rumah Putik", jenis: "Pendidikan",
        lat: -6.1332811, lng: 106.9921616, foto: "foto/tk-rumah-putik.jpg",
        alamat: "Perumahan Harapan Mulya Regency", telp: "0821-1241-8059", jam: "" },

      { nama: "Masjid Jami Al-Mujahidun", jenis: "Tempat Ibadah",
        lat: -6.139155, lng: 106.9906924, foto: "foto/masjid-al-mujahidun.jpg",
        alamat: "Jl. Taruma Jaya No. 13, Kp. Pamahan", telp: "0858-9429-0102", jam: "" },
      { nama: "Masjid Jami Nurul Iman", jenis: "Tempat Ibadah",
        lat: -6.1345467, lng: 106.9912517, foto: "foto/masjid-nurul-iman.jpg",
        alamat: "Pinggir jalan raya", telp: "", jam: "" },
      { nama: "Masjid Raya Harapan Mulya", jenis: "Tempat Ibadah",
        lat: -6.1400474, lng: 106.9939395, foto: "foto/masjid-harapan-mulya.jpg",
        alamat: "Jl. Efodia 5 No. 009, Perumahan Harapan Mulya", telp: "0812-1000-3575", jam: "" },
      { nama: "Masjid Jami Birril Waalidiina", jenis: "Tempat Ibadah",
        lat: -6.14458, lng: 106.9918337, foto: "foto/masjid-birril-waalidiina.jpg",
        alamat: "Jl. Taruma Jaya", telp: "0812-8050-6878", jam: "" },
      { nama: "Masjid Jami Baytussalam", jenis: "Tempat Ibadah",
        lat: -6.129934, lng: 106.988242, foto: "foto/masjid-baytussalam.jpg",
        alamat: "Bagian utara desa", telp: "0813-1150-0812", jam: "" },

      { nama: "Indomaret Taruma Jaya Setia", jenis: "Toko & Layanan",
        lat: -6.1349953, lng: 106.9913401, foto: "foto/indomaret.jpg",
        alamat: "Kp. Pamahan Bulak, RT 01/RW 08", telp: "", jam: "07.00-22.00" },
      { nama: "O!Save Setia Mulya", jenis: "Toko & Layanan",
        lat: -6.1400533, lng: 106.9907092, foto: "foto/osave.jpg",
        alamat: "Jl. Taruma Jaya", telp: "", jam: "07.00-22.00" },
      { nama: "Terusan Tarumajaya (swalayan)", jenis: "Toko & Layanan",
        lat: -6.1274505, lng: 106.9913683, foto: "foto/terusan.jpg",
        alamat: "Jl. Tarumajaya Raya No. 65", telp: "0852-2074-8131", jam: "08.00-21.30" },
      { nama: "SPBU Pertamina 34.172.06", jenis: "Toko & Layanan",
        lat: -6.1410195, lng: 106.9907338, foto: "foto/spbu.jpg",
        alamat: "Kp. Pamahan, Jl. Raya", telp: "", jam: "06.00-22.00" },

      { nama: "Tempat Pemakaman Umum", jenis: "Pemakaman",
        lat: -6.1368261, lng: 106.9906578, foto: "foto/tpu.jpg",
        alamat: "", telp: "", jam: "" }
    ];

    const listEl = document.getElementById('list');
    const cariEl = document.getElementById('cari');
    const jenisEl = document.getElementById('jenis');

    jenisEl.innerHTML = '<option value="">Semua jenis tempat</option>' +
      Object.keys(WARNA).map(j => `<option>${j}</option>`).join('');

    tempat.forEach(t => {
      const ikon = L.divIcon({
        className: '',
        html: `<div style="width:14px;height:14px;border-radius:50%;background:${WARNA[t.jenis]};border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.35)"></div>`,
        iconSize: [14, 14],
        iconAnchor: [7, 7]
      });
      t.marker = L.marker([t.lat, t.lng], { icon: ikon, title: t.nama });

      const baris = [
        t.alamat && `<p>${t.alamat}</p>`,
        t.jam && `<p>Jam: ${t.jam}</p>`,
        t.telp && `<p>Telp: ${t.telp}</p>`
      ].filter(Boolean).join('');
      const foto = t.foto
        ? `<a href="${t.foto}" target="_blank" rel="noopener"><img src="${t.foto}" alt="${t.nama}" onerror="this.parentNode.remove()"></a>`
        : '';

      t.marker.bindPopup(
        `${foto}<h3>${t.nama}</h3>${baris}` +
        `<p><a href="https://www.google.com/maps/dir/?api=1&destination=${t.lat},${t.lng}" target="_blank" rel="noopener">Petunjuk arah</a></p>`,
        { minWidth: 220, maxWidth: 260 }
      );
    });

    function tampilkan() {
      const kata = cariEl.value.trim().toLowerCase();
      const jenis = jenisEl.value;
      listEl.innerHTML = '';

      Object.keys(WARNA).forEach(j => {
        const isi = tempat.filter(t =>
          t.jenis === j &&
          (!jenis || jenis === j) &&
          (t.nama.toLowerCase().includes(kata) || (t.alamat || '').toLowerCase().includes(kata))
        );

        tempat.filter(t => t.jenis === j).forEach(t => {
          if (isi.includes(t)) t.marker.addTo(map); else map.removeLayer(t.marker);
        });
        if (!isi.length) return;

        const h = document.createElement('div');
        h.className = 'grup';
        h.innerHTML = `<i style="background:${WARNA[j]}"></i>${j}`;
        listEl.appendChild(h);

        isi.forEach(t => {
          const d = document.createElement('div');
          d.className = 'baris';
          d.innerHTML = t.nama + (t.alamat ? `<span>${t.alamat}</span>` : '');
          d.onclick = () => {
            map.flyTo([t.lat, t.lng], 17, { duration: 0.8 });
            t.marker.openPopup();
          };
          listEl.appendChild(d);
        });
      });
    }

    cariEl.addEventListener('input', tampilkan);
    jenisEl.addEventListener('change', tampilkan);
    tampilkan();
    map.fitBounds(L.latLngBounds(tempat.map(t => [t.lat, t.lng])).pad(0.15));
  </script>
</body>
</html>
